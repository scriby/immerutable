name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn check:types
      - run: yarn test:ci
      - run: yarn check:browser
        if: matrix.node == 24
      - run: yarn fuzz --runInBand
        if: matrix.node == 24
        env:
          FUZZ_SEED: '1017581210'
